name: Verify Noon Studio
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workbench/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: python -m pip install -r workbench/requirements.lock
      - run: python -m pip check
      - run: python scripts/doctor.py
      - name: Full regression suite
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python -m unittest discover -s workbench/tests -v 2>&1 | tee artifacts/backend-tests.log
      - name: Desktop packaging orchestration
        run: python -m unittest discover -s desktop/tests -v
      - name: Isolated startup and restart
        if: ${{ !cancelled() }}
        run: python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-verification
          path: artifacts/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - run: python -m pip install -r workbench/requirements.lock
      - run: npm ci --prefix scripts/browser
      - run: npx --prefix scripts/browser playwright install --with-deps chromium
      - name: JavaScript syntax
        run: for script in workbench/static/*.js browser-extension/domestic-capture/*.js; do node --check "$script"; done
      - name: Real Chromium smoke
        env:
          NOON_PYTHON: python
        run: node scripts/browser/smoke.cjs
      - name: Synthetic multichannel browser workflow
        env:
          NOON_PYTHON: python
        run: node scripts/browser/collection.cjs
      - name: Local ERP business workflow
        env:
          NOON_PYTHON: python
        run: node scripts/browser/erp.cjs
      - name: Warehouse, finance, returns and exception workflows
        env:
          NOON_PYTHON: python
        run: |
          for workflow in bank fulfillment after_sales procurement batch_edit alerts inventory_counts shipping_manifests pricing_plans ad_analytics import_profiles domestic_capture domestic_extension domestic_sources supplier_quotes fx_registry replenishment; do
            node "scripts/browser/${workflow}.cjs"
          done

      - name: Deepened ERP business workflows
        env:
          NOON_PYTHON: python
        run: |
          for workflow in domestic_capture catalog_groups supplier_quotes replenishment analytics alerts; do
            node "scripts/browser/${workflow}_deepening.cjs"
          done
