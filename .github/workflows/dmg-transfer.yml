name: Transfer verified DMG
on:
  workflow_dispatch:
  push:
    branches: ['codex/dmg-release-0.43.0']
    paths: ['.github/workflows/dmg-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Noon-Studio-0.43.0-macOS-arm64
          run-id: 37114268786
          github-token: ${{ github.token }}
          path: verified-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native artifact and create bounded transport parts
        run: |
          python - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          source=Path('verified-release/Noon-Studio-0.43.0-macOS-arm64.dmg')
          digest=hashlib.file_digest(source.open('rb'),'sha256').hexdigest()
          expected=source.with_suffix('.dmg.sha256').read_text().split()[0]
          assert digest==expected,'Native DMG checksum mismatch'
          report={'filename':source.name,'sha256':digest,'bytes':source.stat().st_size,'source_run':37114268786,'parts':[]}
          with source.open('rb') as f:
            index=0
            while data:=f.read(25*1024*1024):
              assert index<8,'DMG exceeds bounded transport size'
              folder=Path('transport')/f'part-{index:02d}'
              folder.mkdir(parents=True)
              name=source.name+f'.part-{index:02d}'
              (folder/name).write_bytes(data)
              report['parts'].append({'name':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              index+=1
          for folder in Path('transport').iterdir():
            (folder/'release-manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-00/*') != '' }}
        with:
          name: Noon-DMG-transport-part-00
          if-no-files-found: error
          path: transport/part-00/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-01/*') != '' }}
        with:
          name: Noon-DMG-transport-part-01
          if-no-files-found: error
          path: transport/part-01/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-02/*') != '' }}
        with:
          name: Noon-DMG-transport-part-02
          if-no-files-found: error
          path: transport/part-02/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-03/*') != '' }}
        with:
          name: Noon-DMG-transport-part-03
          if-no-files-found: error
          path: transport/part-03/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-04/*') != '' }}
        with:
          name: Noon-DMG-transport-part-04
          if-no-files-found: error
          path: transport/part-04/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-05/*') != '' }}
        with:
          name: Noon-DMG-transport-part-05
          if-no-files-found: error
          path: transport/part-05/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-06/*') != '' }}
        with:
          name: Noon-DMG-transport-part-06
          if-no-files-found: error
          path: transport/part-06/*
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('transport/part-07/*') != '' }}
        with:
          name: Noon-DMG-transport-part-07
          if-no-files-found: error
          path: transport/part-07/*
