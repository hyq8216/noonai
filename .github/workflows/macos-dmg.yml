name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths:
      - 'desktop/**'
      - 'workbench/**'
      - 'browser-extension/**'
      - '.github/workflows/macos-dmg.yml'
permissions:
  contents: read
concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native architecture and release
        id: release
        run: |
          python -c 'import platform; assert platform.system() == "Darwin"; print(platform.machine())'
          echo "arch=$(python -c 'import platform; print(platform.machine())')" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import json; print(json.load(open("desktop/release.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Install local build environment
        run: |
          python -m venv desktop/.venv
          desktop/.venv/bin/python -m pip install -r desktop/requirements-build.txt
          desktop/.venv/bin/python -m pip check
      - name: Packaging regression tests
        run: desktop/.venv/bin/python -m unittest discover -s desktop/tests -v
      - name: Build app and verify frozen backend
        run: desktop/.venv/bin/python desktop/build.py --dist desktop/dist/release --arch '${{ steps.release.outputs.arch }}'
      - name: Create and mount-check DMG
        run: desktop/.venv/bin/python desktop/package_dmg.py --app 'desktop/dist/release/Noon Studio.app' --output-dir desktop/dist/release --version '${{ steps.release.outputs.version }}' --arch '${{ steps.release.outputs.arch }}' --zip
      - uses: actions/upload-artifact@v4
        with:
          name: Noon-Studio-${{ steps.release.outputs.version }}-macOS-${{ steps.release.outputs.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/release/*.dmg
            desktop/dist/release/*.zip
            desktop/dist/release/*.sha256
